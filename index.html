<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stop-Point Annotation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe6;--paper2:#ece5d8;--ink:#23201b;--soft:#5c564c;
  --line:#d6cdbb;--red:#c8412b;--red2:#e8c4bb;--green:#3f6b4f;
  --serif:"Spectral",Georgia,serif;--sans:"Spline Sans",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px}
.topbar{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:24px}
.brand{font-family:var(--serif);font-size:18px}.brand span{color:var(--red)}
.who{font-family:var(--mono);font-size:12px;color:var(--soft)}
h1{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2;margin-bottom:.5em}
h2{font-family:var(--serif);font-size:18px;font-weight:600;margin:1.2em 0 .4em}
p{margin:.5em 0}.muted{color:var(--soft);font-size:13px}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
.stack>*+*{margin-top:14px}
label.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin-bottom:5px}
input[type=text],textarea{width:100%;font-family:var(--mono);font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink);resize:vertical}
input[type=text]:focus,textarea:focus{outline:2px solid var(--red2);border-color:var(--red)}
.btn{font-family:var(--sans);font-weight:500;font-size:14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:7px;transition:opacity .12s}
.btn:hover{opacity:.88}.btn:active{opacity:.75}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
kbd{font-family:var(--mono);font-size:11px;background:var(--paper);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
hr.div{border:none;border-top:1px solid var(--line);margin:16px 0}
/* welcome */
.defn{font-family:var(--serif);font-size:17px;border-left:3px solid var(--red);padding-left:14px;line-height:1.65}
.taglist{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:7px;margin-top:8px}
.tagdef{border:1px solid var(--line);border-radius:8px;padding:8px 11px;background:var(--paper);font-size:13px}
.tagdef b{display:block;margin-bottom:2px}.tagdef span{color:var(--soft);font-size:12px}
.cite{font-size:11px;color:var(--soft);font-style:italic;margin-top:6px}
.tog-on{background:var(--ink)!important;color:var(--paper)!important;border-color:var(--ink)!important}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
input[type=number]{width:100%;font-family:var(--mono);font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)}
input[type=number]:focus{outline:2px solid var(--red2);border-color:var(--red)}
/* dashboard */
.prog{font-family:var(--mono);font-size:12px;color:var(--soft);margin:4px 0 20px}
.dash-table{width:100%;border-collapse:separate;border-spacing:0;margin-bottom:24px}
.col-header{font-size:11px;font-weight:600;color:var(--soft);text-align:center;padding:0 6px 12px;letter-spacing:.06em;text-transform:uppercase}
.row-header{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--ink);text-align:right;padding:5px 16px 5px 0;white-space:nowrap;vertical-align:middle}
.dcell{padding:4px;vertical-align:middle}
.dcell-inner{border:1px solid var(--line);border-radius:10px;background:var(--paper2);cursor:pointer;padding:11px 10px;transition:border-color .12s,background .12s,transform .1s;text-align:center;min-width:110px;display:block}
.dcell-inner:hover{border-color:var(--ink);background:var(--paper);transform:translateY(-1px)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-family:var(--mono);letter-spacing:.04em;padding:3px 8px;border-radius:999px;font-weight:500}
.bdot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;display:inline-block}
.badge.todo{background:var(--paper);color:var(--soft);border:1px solid var(--line)}
.badge.active{background:#fef3e2;color:#a05c00;border:1px solid #f0c070}
.badge.done{background:#e6f2eb;color:var(--green);border:1px solid #a8d4b8}
.dsub{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:5px}
/* workspace two-col */
.ws-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.score-col{position:sticky;top:16px;max-height:92vh;overflow-y:auto}
.score-col img{width:100%;display:block;border:1px solid var(--line);border-radius:6px;background:#fbf8f1}
.score-col img+img{margin-top:6px}
.score-missing{color:var(--soft);font-family:var(--mono);font-size:12px;padding:20px;text-align:center;border:1px solid var(--line);border-radius:6px}
.right-col{display:flex;flex-direction:column;gap:10px}
.wshead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
/* taxonomy bar */
.taxbar{background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px}
.taxbar b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);margin-bottom:5px}
.taxpills{display:flex;gap:5px;flex-wrap:wrap}
.taxpill{font-family:var(--mono);font-size:10px;background:var(--paper);border:1px solid var(--line);color:var(--soft);padding:2px 7px;border-radius:999px;white-space:nowrap}
.taxrows{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.taxrow{display:flex;align-items:baseline;gap:8px}
.taxd{font-size:11px;color:var(--soft)}
/* transport */
.transport{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.clock{font-family:var(--mono);font-size:22px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.clock .tot{font-size:12px;color:var(--soft)}
.meter{height:5px;background:var(--paper);border-radius:999px;margin:10px 0;border:1px solid var(--line);overflow:hidden;cursor:pointer}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--red),#e06a52)}
.markbtn{font-family:var(--sans);font-weight:600;font-size:15px;cursor:pointer;background:var(--red);color:#fff;border:none;border-radius:9px;padding:12px 18px;box-shadow:0 4px 14px -6px rgba(200,65,43,.65);transition:transform .05s;width:100%;margin-top:8px}
.markbtn:active{transform:scale(.97)}.markbtn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
.chips{display:flex;gap:5px;flex-wrap:wrap;min-height:18px;margin-top:8px}
.chip{font-family:var(--mono);font-size:11px;background:var(--paper);border:1px solid var(--red2);color:var(--red);padding:2px 7px;border-radius:5px}
.hint{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:5px}
/* tagging */
.mrow{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper2);display:flex;flex-direction:column;gap:8px}
.mrow.del .mtime,.mrow.del .tagbtns,.mrow.del .ctx-bar,.mrow.del .other-note{opacity:.38}
.mrow.trailing{border-style:dashed}
.mrow.first-seg{background:#f0ebe0;border-color:#c8a882}
/* dashboard table */
.dash-table{width:100%;border-collapse:separate;border-spacing:6px;margin-bottom:20px}
.dash-table th{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--soft);text-align:center;padding:4px 8px}
.dash-table th.piece-th{text-align:right;font-size:13px;color:var(--ink);min-width:160px}
.dash-cell{border:1px solid var(--line);border-radius:8px;background:var(--paper2);cursor:pointer;padding:10px 12px;transition:border-color .12s;text-align:center;vertical-align:middle}
.dash-cell:hover{border-color:var(--ink);background:var(--paper)}
.dash-cell .sub{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:3px}
.st.todo{color:var(--soft)}.st.active{color:var(--red)}.st.done{color:var(--green)}
.mrow-top{display:flex;align-items:center;gap:10px}
.mtime{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;min-width:70px}
.mrange{font-family:var(--mono);font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.tagbtns{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tbtn{font-size:11px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--soft);padding:4px 9px;border-radius:999px;font-family:var(--sans)}
.tbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mrow-ctx{display:flex;align-items:center;gap:6px}
.sbtn{font-family:var(--mono);font-size:11px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--soft);padding:4px 8px;border-radius:6px}
.sbtn:hover{border-color:var(--ink);color:var(--ink)}
.ctx-bar{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 10px;margin-top:4px}
.ctx-bar .clock2{font-family:var(--mono);font-size:13px;min-width:60px}
.ctx-meter{flex:1;height:4px;background:var(--line);border-radius:999px;overflow:hidden;cursor:pointer}
.ctx-fill{height:100%;width:0;background:var(--red)}
.other-note{margin-top:4px}
.banner{border:1px dashed var(--red);background:#f7e9e5;border-radius:8px;padding:10px 13px;font-size:13px}
.footnote{margin-top:28px;font-size:12px;color:var(--soft);border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">Stop<span>●</span>Point</div>
    <div class="who" id="whoLabel"></div>
  </div>
  <div id="app"></div>
  <div class="footnote">Progress saves automatically. Export before closing.</div>
</div>
<script>
/* ── Taxonomy (Morsi et al., SMC 2024 + Palmer & van de Sande 1993) ── */
const TAGS = [
  {k:"pitch",     l:"Pitch",          d:"Insertions, deletions, substitutions, mistouches"},
  {k:"rhythm",    l:"Rhythm",         d:"Hesitations, pauses, dragging notes, beat interruptions"},
  {k:"dynamics",  l:"Dynamics",       d:"Unexpected loudness, velocity errors, balance"},
  {k:"structure", l:"Structure",      d:"Repetitions, loss of place, stopping mid-phrase"},
  {k:"technique", l:"Technique",      d:"Pedaling, evenness, articulation, physical control"},
  {k:"interp",    l:"Interpretation", d:"Phrasing, style, musical expression beyond notation"},
  {k:"other",     l:"Other",          d:""}
];
const TAX_CITE = "Pitch, Rhythm, Dynamics, Structure: Morsi et al. (SMC 2024). Technique, Interpretation: Palmer & van de Sande (1993).";

const SCORES = {
  1: ["scores/CarelessLove-1.png","scores/CarelessLove-2.png"],
  2: ["scores/CielitoLindo-1.png"],
  3: ["scores/LavendersBlue-1.png","scores/LavendersBlue-2.png"],
  4: ["scores/OverTheWaves-1.png","scores/OverTheWaves-2.png"],
  5: ["scores/SheWoreAYellowRibbon-1.png","scores/SheWoreAYellowRibbon-2.png"],
  6: ["scores/TheBlues-1.png"],
  7: ["scores/TheEntertainer-1.png","scores/TheEntertainer-2.png"],
};

const PERFORMANCES = [
  {id:"P01_R10",piece:"Careless Love",piece_id:1,recording_number:10,audioUrl:"audio/P01_R10.wav"},
  {id:"P01_R07",piece:"Careless Love",piece_id:1,recording_number:7, audioUrl:"audio/P01_R07.wav"},
  {id:"P01_R01",piece:"Careless Love",piece_id:1,recording_number:1, audioUrl:"audio/P01_R01.wav"},
  {id:"P02_R01",piece:"Cielito Lindo",piece_id:2,recording_number:1, audioUrl:"audio/P02_R01.wav"},
  {id:"P02_R06",piece:"Cielito Lindo",piece_id:2,recording_number:6, audioUrl:"audio/P02_R06.wav"},
  {id:"P02_R02",piece:"Cielito Lindo",piece_id:2,recording_number:2, audioUrl:"audio/P02_R02.wav"},
  {id:"P03_R14",piece:"Lavender's Blue",piece_id:3,recording_number:14,audioUrl:"audio/P03_R14.wav"},
  {id:"P03_R09",piece:"Lavender's Blue",piece_id:3,recording_number:9, audioUrl:"audio/P03_R09.wav"},
  {id:"P03_R16",piece:"Lavender's Blue",piece_id:3,recording_number:16,audioUrl:"audio/P03_R16.wav"},
  {id:"P04_R08",piece:"Over the Waves",piece_id:4,recording_number:8, audioUrl:"audio/P04_R08.wav"},
  {id:"P04_R06",piece:"Over the Waves",piece_id:4,recording_number:6, audioUrl:"audio/P04_R06.wav"},
  {id:"P04_R09",piece:"Over the Waves",piece_id:4,recording_number:9, audioUrl:"audio/P04_R09.wav"},
  {id:"P05_R10",piece:"She Wore a Yellow Ribbon",piece_id:5,recording_number:10,audioUrl:"audio/P05_R10.wav"},
  {id:"P05_R07",piece:"She Wore a Yellow Ribbon",piece_id:5,recording_number:7, audioUrl:"audio/P05_R07.wav"},
  {id:"P05_R12",piece:"She Wore a Yellow Ribbon",piece_id:5,recording_number:12,audioUrl:"audio/P05_R12.wav"},
  {id:"P06_R08",piece:"The Blues",piece_id:6,recording_number:8, audioUrl:"audio/P06_R08.wav"},
  {id:"P06_R11",piece:"The Blues",piece_id:6,recording_number:11,audioUrl:"audio/P06_R11.wav"},
  {id:"P06_R17",piece:"The Blues",piece_id:6,recording_number:17,audioUrl:"audio/P06_R17.wav"},
  {id:"P07_R04",piece:"The Entertainer",piece_id:7,recording_number:4, audioUrl:"audio/P07_R04.wav"},
  {id:"P07_R08",piece:"The Entertainer",piece_id:7,recording_number:8, audioUrl:"audio/P07_R08.wav"},
  {id:"P07_R01",piece:"The Entertainer",piece_id:7,recording_number:1, audioUrl:"audio/P07_R01.wav"},
];

const CACHE_KEY="stoppoint_v5";
let S={annotatorId:"",screen:"welcome",currentId:null,data:{},ws:null,dashScroll:0,
  demo:{yearsTeaching:"",yearsPlaying:"",training:"",teachesBeginners:""},
  pieceOrder:null, perfOrder:{}};
PERFORMANCES.forEach(p=>{S.data[p.id]={done:false,marks:[]};});

function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({annotatorId:S.annotatorId,data:S.data,demo:S.demo,pieceOrder:S.pieceOrder,perfOrder:S.perfOrder}));}catch(e){}}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(!c)return;if(c.annotatorId)S.annotatorId=c.annotatorId;if(c.data)Object.keys(c.data).forEach(k=>{if(S.data[k])S.data[k]=c.data[k];});if(c.demo)S.demo=c.demo;if(c.pieceOrder)S.pieceOrder=c.pieceOrder;if(c.perfOrder)S.perfOrder=c.perfOrder;}catch(e){}}
loadCache();

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function ensureOrder(){
  const pieces=[...new Set(PERFORMANCES.map(p=>p.piece_id))];
  if(!S.pieceOrder){S.pieceOrder=shuffle(pieces);saveCache();}
  pieces.forEach(pid=>{
    if(!S.perfOrder[pid]){
      const ids=PERFORMANCES.filter(p=>p.piece_id===pid).map(p=>p.id);
      S.perfOrder[pid]=shuffle(ids);saveCache();
    }
  });
}
loadCache();

const app=document.getElementById("app"),whoLabel=document.getElementById("whoLabel");
const fmt=t=>{if(t==null||isNaN(t))return"--:--";const m=Math.floor(t/60),s=t-m*60;return String(m).padStart(2,"0")+":"+s.toFixed(2).padStart(5,"0");};
const fmtS=t=>{if(t==null||isNaN(t))return"--";return Math.round(t)+"s";};
const perf=id=>PERFORMANCES.find(p=>p.id===id);

function render(){
  whoLabel.textContent=S.annotatorId?"annotator: "+S.annotatorId:"";
  if(S.screen==="welcome")renderWelcome();
  else if(S.screen==="dashboard")renderDashboard();
  else if(S.screen==="workspace")renderWorkspace();
}

/* ── WELCOME ── */
function renderWelcome(){
  const d=S.demo;
  app.innerHTML=`<h1>Teacher Intervention Annotation</h1>
  <div class="card stack">
    <p>You will listen to <b>21 beginner piano performances</b> across 7 pieces (3 per piece). Your task:</p>
    <div class="defn">As you listen, mark the moment you would <b>stop the student</b> to give corrective feedback — only stops you would actually make in a real lesson.</div>
    <p class="muted">Each performance is a <b>single real-time listen with no rewind</b>. Press <kbd>S</kbd> on your keyboard or click <b>STOP</b> using your mouse at the exact moment you would interrupt. When it ends, tag each mark with one or more reasons.</p>
    <div>
      <div class="lbl">Error taxonomy</div>
      <div class="taglist">${TAGS.map(t=>`<div class="tagdef"><b>${t.l}</b><span>${t.d}</span></div>`).join("")}</div>
      <div class="cite">${TAX_CITE}</div>
    </div>
    <hr class="div">
    <div>
      <label class="lbl" for="aid">Full name</label>
      <input id="aid" type="text" placeholder="e.g. Jane Smith" value="${S.annotatorId}" autocomplete="off">
    </div>
    <div class="two-col">
      <div>
        <label class="lbl" for="yearsTeaching">Years teaching piano</label>
        <input id="yearsTeaching" type="number" min="0" max="60" placeholder="e.g. 8" value="${d.yearsTeaching}" autocomplete="off">
      </div>
      <div>
        <label class="lbl" for="yearsPlaying">Years playing piano</label>
        <input id="yearsPlaying" type="number" min="0" max="80" placeholder="e.g. 15" value="${d.yearsPlaying}" autocomplete="off">
      </div>
    </div>
    <div class="two-col">
      <div>
        <label class="lbl" for="training">Highest formal music qualification</label>
        <input id="training" type="text" placeholder="e.g. Conservatoire diploma, Music degree, Private study" value="${d.training}" autocomplete="off">
      </div>
      <div style="display:flex;flex-direction:column;justify-content:flex-end">
        <label class="lbl">Have you regularly taught beginners before?</label>
        <div class="row" style="margin-top:6px;gap:8px">
          <button class="btn ghost togbtn ${d.teachesBeginners==='yes'?'tog-on':''}" data-val="yes">Yes</button>
          <button class="btn ghost togbtn ${d.teachesBeginners==='no'?'tog-on':''}" data-val="no">No</button>
        </div>
      </div>
    </div>
    <div id="errMsg" style="color:var(--red);font-size:13px;display:none">Please fill in all fields before continuing.</div>
    <div style="display:flex;justify-content:flex-end;margin-top:24px"><button class="btn" id="startBtn">Go to performances</button></div>
  </div>`;

  document.querySelectorAll(".togbtn").forEach(b=>b.onclick=()=>{
    S.demo.teachesBeginners=b.dataset.val; saveCache();
    document.querySelectorAll(".togbtn").forEach(x=>x.classList.remove("tog-on"));
    b.classList.add("tog-on");
  });

  const btn=document.getElementById("startBtn");
  btn.onclick=()=>{
    const name=document.getElementById("aid").value.trim();
    const yt=document.getElementById("yearsTeaching").value.trim();
    const yp=document.getElementById("yearsPlaying").value.trim();
    const tr=document.getElementById("training").value.trim();
    const tb=S.demo.teachesBeginners;
    if(!name||!yt||!yp||!tr||!tb){
      document.getElementById("errMsg").style.display="block"; return;
    }
    S.annotatorId=name;
    S.demo={yearsTeaching:yt,yearsPlaying:yp,training:tr,teachesBeginners:tb};
    saveCache(); S.screen="dashboard"; render();
  };
}

/* ── DASHBOARD ── */
function statusOf(id){
  const d=S.data[id];
  if(d.done)return d.marks.filter(m=>!m.deleted&&!m.tags.length).length?{cls:"active",txt:"needs tags"}:{cls:"done",txt:"done ✓"};
  return{cls:"todo",txt:"not started"};
}
function renderDashboard(){
  ensureOrder();
  const done=PERFORMANCES.filter(p=>statusOf(p.id).cls==="done").length;
  const stLabel={todo:"not started",active:"needs tags",done:"done ✓"};
  let html=`<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px">
    <h1>Performances</h1>
    <button class="btn ghost" id="backToProfile" style="font-size:13px">← Edit profile</button>
  </div>
  <div class="prog">${done} / ${PERFORMANCES.length} complete</div>
  <table class="dash-table">
    <thead><tr>
      <th style="width:170px"></th>
      <th class="col-header">Performance 1</th>
      <th class="col-header">Performance 2</th>
      <th class="col-header">Performance 3</th>
    </tr></thead>
    <tbody>`;
  S.pieceOrder.forEach(pid=>{
    const orderedIds=S.perfOrder[pid];
    const pieceName=PERFORMANCES.find(p=>p.piece_id===pid).piece;
    html+=`<tr><th class="row-header">${pieceName}</th>`;
    orderedIds.forEach(id=>{
      const st=statusOf(id),nm=S.data[id].marks.filter(m=>!m.deleted&&!m.trailing).length;
      html+=`<td class="dcell"><div class="dcell-inner" data-id="${id}">
        <span class="badge ${st.cls}"><span class="bdot"></span>${stLabel[st.cls]}</span>
        <div class="dsub">${nm?nm+" stop"+(nm>1?"s":""):"—"}</div>
      </div></td>`;
    });
    html+=`</tr>`;
  });
  html+=`</tbody></table>
  <div class="row" style="margin-top:4px">
    <button class="btn" id="exportBtn">Export annotations</button>
    <span class="muted">Send both JSON + CSV back.</span>
  </div>`;
  app.innerHTML=html;
  document.querySelectorAll(".dcell-inner").forEach(r=>r.onclick=()=>{S.dashScroll=window.scrollY;S.currentId=r.dataset.id;openWS();});
  document.getElementById("exportBtn").onclick=exportData;
  document.getElementById("backToProfile").onclick=()=>{S.screen="welcome";render();};
  requestAnimationFrame(()=>window.scrollTo(0,S.dashScroll));
}

/* ── WORKSPACE ── */
function openWS(){
  S.screen="workspace";
  const d=S.data[S.currentId];
  S.ws={phase:d.done?"tag":"play",playing:false,liveMarks:[],audio:null,_key:null};
  render();
}

function taxBar(){
  return `<div class="taxbar"><b>Error taxonomy</b><div class="taxrows">${TAGS.filter(t=>t.k!=="other").map(t=>`<div class="taxrow"><span class="taxpill">${t.l}</span><span class="taxd">${t.d}</span></div>`).join("")}</div></div>`;
}

function renderWorkspace(){
  const id=S.currentId,p=perf(id),d=S.data[id];
  const group=PERFORMANCES.filter(q=>q.piece_id===p.piece_id);
  const pos=group.findIndex(q=>q.id===id)+1;
  const pages=SCORES[p.piece_id]||[];
  const scoreHtml=pages.length
    ?pages.map(src=>`<img src="${src}" alt="score" onerror="this.style.display='none'">`).join("")
    :`<div class="score-missing">Score not found</div>`;

  app.innerHTML=`
  <div class="wshead">
    <div><h1 style="margin-bottom:2px">${p.piece} — Performance ${pos}</h1></div>
    <button class="btn ghost" id="backBtn">← back</button>
  </div>
  <div class="ws-layout">
    <div class="score-col">${scoreHtml}</div>
    <div class="right-col" id="rightCol">${taxBar()}</div>
  </div>`;

  document.getElementById("backBtn").onclick=()=>{teardown();S.screen="dashboard";render();};
  if(S.ws.phase==="play")renderPlay(p.audioUrl);
  else renderTag(p.audioUrl);
}

/* ── PLAY ── */
function renderPlay(audioSrc){
  const col=document.getElementById("rightCol");
  const existing=col.querySelector(".taxbar");
  col.innerHTML=(existing?existing.outerHTML:taxBar())+`
    <div class="banner">Single real-time listen — no rewind. Press <kbd>S</kbd> on your keyboard or click <b>STOP</b> using your mouse at the moment you would stop the student.</div>
    <div class="transport">
      <div class="clock"><span id="cur">00:00.00</span> <span class="tot">/ <span id="tot">--:--</span></span></div>
      <div class="meter" id="meter"><div class="fill" id="fill"></div></div>
      <div class="row" style="gap:8px">
        <button class="btn ghost" id="playBtn">▶ Start</button>
      </div>
      <button class="markbtn" id="markBtn" disabled>STOP</button>
      <div class="chips" id="chips"></div>
      <div class="hint" id="phint">Press Start when ready.</div>
    </div>`;

  const a=new Audio(audioSrc);a.preload="auto";S.ws.audio=a;
  const cur=document.getElementById("cur"),tot=document.getElementById("tot"),
        fill=document.getElementById("fill"),chips=document.getElementById("chips"),
        playBtn=document.getElementById("playBtn"),markBtn=document.getElementById("markBtn"),
        phint=document.getElementById("phint");

  a.addEventListener("loadedmetadata",()=>{tot.textContent=fmt(a.duration);});
  a.addEventListener("timeupdate",()=>{cur.textContent=fmt(a.currentTime);if(a.duration)fill.style.width=(100*a.currentTime/a.duration)+"%";});
  a.addEventListener("error",()=>{phint.textContent="Audio not found: "+audioSrc;playBtn.disabled=true;});

  const drawChips=()=>{chips.innerHTML=S.ws.liveMarks.map(t=>`<span class="chip">${fmt(t)}</span>`).join("");};
  const doMark=()=>{if(!S.ws.playing)return;S.ws.liveMarks.push(+a.currentTime.toFixed(3));drawChips();markBtn.style.transform="scale(.93)";setTimeout(()=>markBtn.style.transform="",80);};

  playBtn.onclick=()=>{a.play();S.ws.playing=true;playBtn.disabled=true;playBtn.textContent="listening…";markBtn.disabled=false;phint.textContent="No rewind. Mark as you go.";};
  markBtn.onclick=doMark;
  const kh=e=>{if(e.repeat)return;if(e.key==="s"||e.key==="S"||e.key==="Enter"){e.preventDefault();doMark();}};
  document.addEventListener("keydown",kh);S.ws._key=kh;

  a.addEventListener("ended",()=>{
    S.ws.playing=false;document.removeEventListener("keydown",kh);
    const d=S.data[S.currentId];
    const dur=a.duration||0;
    d.marks=S.ws.liveMarks.map(t=>({t,tags:[],note:"",deleted:false,trailing:false}));
    // always add trailing segment from last mark (or 0) to end
    const lastT=d.marks.length?d.marks[d.marks.length-1].t:0;
    d.marks.push({t:dur,tags:[],note:"",deleted:false,trailing:true,fromT:lastT});
    d.done=true;saveCache();S.ws.phase="tag";render();
  });
}

/* ── TAG ── */
function renderTag(audioSrc){
  const id=S.currentId,d=S.data[id];
  const col=document.getElementById("rightCol");
  const marks=d.marks;

  // context audio player (shared, reused)
  const ctxAudio=new Audio(audioSrc);
  ctxAudio.preload="auto";

  col.innerHTML=taxBar()+`
    <h2 style="margin-top:0">Label each stop</h2>
    <p class="muted">Select one or more reasons. ▶ plays from the previous stop (or start) to this mark. Use ◀▶ to scrub.</p>
    <div style="display:flex;flex-direction:column;gap:8px" id="mlist"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="doneBtn">Save &amp; back to performances</button>
    </div>`;

  const mlist=document.getElementById("mlist");

  function draw(){
    if(!marks.length){mlist.innerHTML=`<p class="muted">No stops marked.</p>`;return;}
    // compute fromT for each mark
    const withFrom=marks.map((m,i)=>{
      if(m.trailing) return {...m,fromT:m.fromT||0};
      const prev=marks.slice(0,i).filter(x=>!x.deleted&&!x.trailing);
      return {...m,fromT:prev.length?prev[prev.length-1].t:0};
    });
    const firstActiveIdx=withFrom.findIndex(x=>!x.deleted&&!x.trailing);
    mlist.innerHTML=withFrom.map((m,i)=>{
      const isFirstActive=i===firstActiveIdx;
      const rangeLabel=m.trailing
        ? `<span class="mrange">${fmtS(m.fromT)} → end</span>`
        : `<span class="mrange">${fmtS(m.fromT)} → ${fmtS(m.t)}</span>`;
      const trailNote=m.trailing?`<div class="muted" style="font-size:11px;margin-bottom:4px">Segment after last stop (to end of performance)</div>`:"";
      return `<div class="mrow ${m.deleted?"del":""} ${m.trailing?"trailing":""} ${isFirstActive?"first-seg":""}" data-i="${i}">
        ${trailNote}
        <div class="mrow-top">
          <div>${rangeLabel}</div>
          <div class="tagbtns">
            ${TAGS.map(t=>`<button class="tbtn ${m.tags.includes(t.k)?"on":""}" data-t="${t.k}" data-i="${i}">${t.l}</button>`).join("")}
          </div>
          <button class="sbtn" data-del="${i}">${m.deleted?"restore":"del"}</button>
        </div>
        ${m.tags.includes("other")?`<div class="other-note"><textarea rows="2" placeholder="Describe the issue…" data-note="${i}">${m.note||""}</textarea></div>`:""}
        <div class="ctx-bar" data-ctx="${i}">
          <button class="sbtn" data-rew="${i}">◀ 2s</button>
          <button class="sbtn" data-playctx="${i}">▶ play segment</button>
          <button class="sbtn" data-fwd="${i}">2s ▶</button>
          <div class="ctx-meter" data-cbar="${i}"><div class="ctx-fill" id="ctxfill${i}"></div></div>
          <div class="clock2" id="ctxcur${i}">--:--</div>
          <button class="sbtn" data-stop="${i}">■</button>
        </div>
      </div>`;
    }).join("");

    // tag toggle — multi-select
    mlist.querySelectorAll(".tbtn").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.i,tk=b.dataset.t;
      const tags=marks[i].tags;
      const idx=tags.indexOf(tk);
      if(idx===-1)tags.push(tk); else tags.splice(idx,1);
      saveCache();draw();
    });

    // delete toggle
    mlist.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{marks[+b.dataset.del].deleted=!marks[+b.dataset.del].deleted;saveCache();draw();});

    // free text note
    mlist.querySelectorAll("[data-note]").forEach(ta=>ta.addEventListener("input",()=>{marks[+ta.dataset.note].note=ta.value;saveCache();}));

    // context playback controls
    mlist.querySelectorAll("[data-playctx]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.playctx,m=marks[i];
      const fromT=m.trailing?m.fromT:(marks.slice(0,i).filter(x=>!x.deleted&&!x.trailing).map(x=>x.t).pop()||0);
      playSegment(ctxAudio,fromT,m.t,i);
    });
    mlist.querySelectorAll("[data-rew]").forEach(b=>b.onclick=()=>{ctxAudio.currentTime=Math.max(0,ctxAudio.currentTime-2);});
    mlist.querySelectorAll("[data-fwd]").forEach(b=>b.onclick=()=>{ctxAudio.currentTime=Math.min(ctxAudio.duration||999,ctxAudio.currentTime+2);});
    mlist.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>{ctxAudio.pause();});
  }

  let activeIdx=null,stopTimer=null;
  function playSegment(audio,from,to,idx){
    clearTimeout(stopTimer);
    audio.pause();
    audio.currentTime=from;
    audio.play();
    activeIdx=idx;
    const dur=(to-from)*1000+500; // play to mark + 0.5s after
    stopTimer=setTimeout(()=>{audio.pause();activeIdx=null;},dur);
  }

  // update ctx meters while playing
  ctxAudio.addEventListener("timeupdate",()=>{
    if(activeIdx===null)return;
    const fill=document.getElementById("ctxfill"+activeIdx);
    const cur=document.getElementById("ctxcur"+activeIdx);
    const m=marks[activeIdx];
    if(!fill||!m)return;
    const from=activeIdx>0?marks.slice(0,activeIdx).filter(x=>!x.deleted).map(x=>x.t).pop()||0:0;
    const span=m.t-from;
    if(span>0)fill.style.width=(Math.min(1,(ctxAudio.currentTime-from)/span)*100)+"%";
    if(cur)cur.textContent=fmt(ctxAudio.currentTime);
  });

  draw();

  document.getElementById("doneBtn").onclick=()=>{
    const un=marks.filter(m=>!m.deleted&&!m.tags.length).length;
    if(un&&!confirm(un+" stop(s) have no tag. Save anyway?"))return;
    teardown();S.screen="dashboard";render();
  };
}

function teardown(){
  if(S.ws){if(S.ws.audio){try{S.ws.audio.pause();}catch(e){}}if(S.ws._key)document.removeEventListener("keydown",S.ws._key);}
}

/* ── EXPORT ── */
function exportData(){
  const at=new Date().toISOString();
  const payload={annotatorId:S.annotatorId,demographics:S.demo,exportedAt:at,taxonomy:TAGS.map(t=>t.k),performances:PERFORMANCES.map(p=>{const d=S.data[p.id];return{id:p.id,piece:p.piece,piece_id:p.piece_id,recording_number:p.recording_number,completed:d.done,marks:d.marks.map((m,i)=>({index:i,from_sec:m.trailing?m.fromT:(d.marks.slice(0,i).filter(x=>!x.deleted&&!x.trailing).map(x=>x.t).pop()||0),to_sec:m.t,trailing:m.trailing||false,tags:m.tags,note:m.note||null,deleted:m.deleted}))};})};
  dl(`stops_${S.annotatorId}_${stamp()}.json`,JSON.stringify(payload,null,2),"application/json");
  let rows=[["annotator","years_teaching","years_playing","training","teaches_beginners","exported_at","id","piece","piece_id","recording_number","completed","mark_index","from_sec","to_sec","trailing","tags","note","deleted"]];
  PERFORMANCES.forEach(p=>{const d=S.data[p.id];if(!d.marks.length)rows.push([S.annotatorId,S.demo.yearsTeaching,S.demo.yearsPlaying,S.demo.training,S.demo.teachesBeginners,at,p.id,p.piece,p.piece_id,p.recording_number,d.done,"","","","","","",""]);else d.marks.forEach((m,i)=>{const fromT=m.trailing?m.fromT:(d.marks.slice(0,i).filter(x=>!x.deleted&&!x.trailing).map(x=>x.t).pop()||0);rows.push([S.annotatorId,S.demo.yearsTeaching,S.demo.yearsPlaying,S.demo.training,S.demo.teachesBeginners,at,p.id,p.piece,p.piece_id,p.recording_number,d.done,i,fromT,m.t,m.trailing||false,m.tags.join("|"),m.note||"",m.deleted]);});});
  dl(`stops_${S.annotatorId}_${stamp()}.csv`,rows.map(r=>r.map(c=>{c=String(c);return/[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",")).join("\n"),"text/csv");
}
const stamp=()=>new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
function dl(name,text,type){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
window.addEventListener("beforeunload",e=>{if(Object.values(S.data).some(d=>d.done)){e.preventDefault();e.returnValue="";}});
render();
</script>
