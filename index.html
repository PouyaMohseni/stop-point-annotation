<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stop-Point Annotation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe6;--paper2:#ece5d8;--ink:#23201b;--soft:#5c564c;
  --line:#d6cdbb;--red:#c8412b;--red2:#e8c4bb;--green:#3f6b4f;
  --serif:"Spectral",Georgia,serif;--sans:"Spline Sans",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 60px}
.topbar{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:24px}
.brand{font-family:var(--serif);font-size:18px}.brand span{color:var(--red)}
.who{font-family:var(--mono);font-size:12px;color:var(--soft)}
h1{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.2;margin-bottom:.5em}
h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:1.4em 0 .4em}
p{margin:.5em 0}.muted{color:var(--soft)}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
.stack>*+*{margin-top:14px}
label.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin-bottom:5px}
input[type=text]{width:100%;font-family:var(--mono);font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--paper);color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--red2);border-color:var(--red)}
.btn{font-family:var(--sans);font-weight:500;font-size:14px;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:7px;transition:opacity .12s}
.btn:hover{opacity:.88}.btn:active{opacity:.75}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* welcome */
.defn{font-family:var(--serif);font-size:17px;border-left:3px solid var(--red);padding-left:14px;line-height:1.65}
.taglist{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:8px}
.tagdef{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--paper);font-size:13px}
.tagdef b{display:block;margin-bottom:2px}.tagdef span{color:var(--soft)}
kbd{font-family:var(--mono);font-size:11px;background:var(--paper);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px}
hr.div{border:none;border-top:1px solid var(--line);margin:16px 0}
/* dashboard */
.prog{font-family:var(--mono);font-size:12px;color:var(--soft);margin:4px 0 18px}
.piece-block{margin-bottom:20px}
.piece-label{font-family:var(--serif);font-size:16px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:8px}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:grid;grid-template-columns:1fr 90px;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 13px;background:var(--paper2);cursor:pointer;transition:border-color .1s}
.prow:hover{border-color:var(--ink)}
.prow .title{font-size:14px;font-weight:500}
.prow .sub{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:2px}
.st{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;text-align:right}
.st.todo{color:var(--soft)}.st.active{color:var(--red)}.st.done{color:var(--green)}
/* workspace — two column */
.ws-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;min-height:80vh}
.score-col{position:sticky;top:20px;overflow-y:auto;max-height:92vh}
.score-col img{width:100%;display:block;border:1px solid var(--line);border-radius:6px;background:#fbf8f1}
.score-col img+img{margin-top:6px}
.score-missing{color:var(--soft);font-family:var(--mono);font-size:12px;padding:20px;text-align:center;border:1px solid var(--line);border-radius:6px}
.right-col{display:flex;flex-direction:column;gap:12px}
.wshead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
/* transport */
.transport{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.clock{font-family:var(--mono);font-size:24px;letter-spacing:1px;font-variant-numeric:tabular-nums}
.clock .tot{font-size:13px;color:var(--soft)}
.meter{height:5px;background:var(--paper);border-radius:999px;margin:10px 0;border:1px solid var(--line);overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--red),#e06a52);transition:width .12s linear}
.markbtn{font-family:var(--sans);font-weight:600;font-size:16px;cursor:pointer;background:var(--red);color:#fff;border:none;border-radius:9px;padding:13px 20px;box-shadow:0 4px 14px -6px rgba(200,65,43,.65);transition:transform .05s;width:100%;margin-top:8px}
.markbtn:active{transform:scale(.97)}.markbtn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none}
.chips{display:flex;gap:5px;flex-wrap:wrap;min-height:18px;margin-top:8px}
.chip{font-family:var(--mono);font-size:11px;background:var(--paper);border:1px solid var(--red2);color:var(--red);padding:2px 7px;border-radius:5px}
.hint{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:6px}
/* tagging */
.mrow{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--paper2)}
.mrow.del{opacity:.38}
.mtime{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.tagbtns{display:flex;gap:4px;flex-wrap:wrap}
.tbtn{font-size:12px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--soft);padding:5px 9px;border-radius:999px;font-family:var(--sans)}
.tbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sbtn{font-family:var(--mono);font-size:11px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--soft);padding:5px 8px;border-radius:6px}
.sbtn:hover{border-color:var(--ink);color:var(--ink)}
.banner{border:1px dashed var(--red);background:#f7e9e5;border-radius:8px;padding:10px 13px;font-size:13px}
audio{width:100%;border-radius:6px}
.footnote{margin-top:28px;font-size:12px;color:var(--soft);border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">Stop<span>●</span>Point</div>
    <div class="who" id="whoLabel"></div>
  </div>
  <div id="app"></div>
  <div class="footnote">Progress saves automatically. Export before closing.</div>
</div>
<script>
// Score pages: list all PNG filenames per piece (1 or 2 pages)
const SCORES = {
  1: ["scores/CarelessLove-1.png","scores/CarelessLove-2.png"],
  2: ["scores/CielitoLindo-1.png"],
  3: ["scores/LavendersBlue-1.png","scores/LavendersBlue-2.png"],
  4: ["scores/OverTheWaves-1.png","scores/OverTheWaves-2.png"],
  5: ["scores/SheWoreAYellowRibbon-1.png","scores/SheWoreAYellowRibbon-2.png"],
  6: ["scores/TheBlues-1.png"],
  7: ["scores/TheEntertainer-1.png","scores/TheEntertainer-2.png"],
};

const PERFORMANCES = [
  {id:"P01_R10",piece:"Careless Love",piece_id:1,recording_number:10,audioUrl:"audio/P01_R10.wav"},
  {id:"P01_R07",piece:"Careless Love",piece_id:1,recording_number:7, audioUrl:"audio/P01_R07.wav"},
  {id:"P01_R01",piece:"Careless Love",piece_id:1,recording_number:1, audioUrl:"audio/P01_R01.wav"},
  {id:"P02_R01",piece:"Cielito Lindo",piece_id:2,recording_number:1, audioUrl:"audio/P02_R01.wav"},
  {id:"P02_R06",piece:"Cielito Lindo",piece_id:2,recording_number:6, audioUrl:"audio/P02_R06.wav"},
  {id:"P02_R02",piece:"Cielito Lindo",piece_id:2,recording_number:2, audioUrl:"audio/P02_R02.wav"},
  {id:"P03_R14",piece:"Lavender's Blue",piece_id:3,recording_number:14,audioUrl:"audio/P03_R14.wav"},
  {id:"P03_R09",piece:"Lavender's Blue",piece_id:3,recording_number:9, audioUrl:"audio/P03_R09.wav"},
  {id:"P03_R16",piece:"Lavender's Blue",piece_id:3,recording_number:16,audioUrl:"audio/P03_R16.wav"},
  {id:"P04_R08",piece:"Over the Waves",piece_id:4,recording_number:8, audioUrl:"audio/P04_R08.wav"},
  {id:"P04_R06",piece:"Over the Waves",piece_id:4,recording_number:6, audioUrl:"audio/P04_R06.wav"},
  {id:"P04_R09",piece:"Over the Waves",piece_id:4,recording_number:9, audioUrl:"audio/P04_R09.wav"},
  {id:"P05_R10",piece:"She Wore a Yellow Ribbon",piece_id:5,recording_number:10,audioUrl:"audio/P05_R10.wav"},
  {id:"P05_R07",piece:"She Wore a Yellow Ribbon",piece_id:5,recording_number:7, audioUrl:"audio/P05_R07.wav"},
  {id:"P05_R12",piece:"She Wore a Yellow Ribbon",piece_id:5,recording_number:12,audioUrl:"audio/P05_R12.wav"},
  {id:"P06_R08",piece:"The Blues",piece_id:6,recording_number:8, audioUrl:"audio/P06_R08.wav"},
  {id:"P06_R11",piece:"The Blues",piece_id:6,recording_number:11,audioUrl:"audio/P06_R11.wav"},
  {id:"P06_R17",piece:"The Blues",piece_id:6,recording_number:17,audioUrl:"audio/P06_R17.wav"},
  {id:"P07_R04",piece:"The Entertainer",piece_id:7,recording_number:4, audioUrl:"audio/P07_R04.wav"},
  {id:"P07_R08",piece:"The Entertainer",piece_id:7,recording_number:8, audioUrl:"audio/P07_R08.wav"},
  {id:"P07_R01",piece:"The Entertainer",piece_id:7,recording_number:1, audioUrl:"audio/P07_R01.wav"},
];

const TAGS=[
  {k:"notes",l:"Notes",d:"Wrong or missing notes, pitch errors"},
  {k:"rhythm",l:"Rhythm",d:"Timing, tempo, rhythmic accuracy"},
  {k:"dynamics",l:"Dynamics",d:"Loudness, balance, volume"},
  {k:"technique",l:"Technique",d:"Fingering, evenness, control"},
  {k:"interp",l:"Interpretation",d:"Phrasing, musicality, style"},
  {k:"other",l:"Other",d:"Anything not covered above"}
];

const CACHE_KEY="stoppoint_v4";
let S={annotatorId:"",screen:"welcome",currentId:null,data:{},ws:null};
PERFORMANCES.forEach(p=>{S.data[p.id]={done:false,clean:false,marks:[]};});

function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({annotatorId:S.annotatorId,data:S.data}));}catch(e){}}
function loadCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(!c)return;if(c.annotatorId)S.annotatorId=c.annotatorId;if(c.data)Object.keys(c.data).forEach(k=>{if(S.data[k])S.data[k]=c.data[k];});}catch(e){}}
loadCache();

const app=document.getElementById("app"),whoLabel=document.getElementById("whoLabel");
const fmt=t=>{if(t==null||isNaN(t))return"--:--";const m=Math.floor(t/60),s=t-m*60;return String(m).padStart(2,"0")+":"+s.toFixed(2).padStart(5,"0");};
const perf=id=>PERFORMANCES.find(p=>p.id===id);

function render(){
  whoLabel.textContent=S.annotatorId?"annotator: "+S.annotatorId:"";
  if(S.screen==="welcome")renderWelcome();
  else if(S.screen==="dashboard")renderDashboard();
  else if(S.screen==="workspace")renderWorkspace();
}

/* WELCOME */
function renderWelcome(){
  app.innerHTML=`<h1>Teacher Intervention Annotation</h1>
  <div class="card stack">
    <p>You will listen to <b>21 beginner piano performances</b> across 7 pieces (3 per piece). Your task:</p>
    <div class="defn">As you listen, mark the moment you would <b>stop the student</b> to give corrective feedback — only stops you would actually make in a real lesson.</div>
    <p class="muted">Each performance is a <b>single real-time listen, no rewind</b>. Press <kbd>S</kbd> or MARK at the exact moment you would interrupt. When it ends, tag each mark with a reason.</p>
    <div>
      <div class="lbl">Reason tags</div>
      <div class="taglist">${TAGS.map(t=>`<div class="tagdef"><b>${t.l}</b><span>${t.d}</span></div>`).join("")}</div>
    </div>
    <hr class="div">
    <div>
      <label class="lbl" for="aid">Your name or initials</label>
      <input id="aid" type="text" placeholder="e.g. AM" value="${S.annotatorId}" autocomplete="off">
    </div>
    <div class="row" style="margin-top:4px"><button class="btn" id="startBtn">Go to performances</button></div>
  </div>`;
  const btn=document.getElementById("startBtn"),inp=document.getElementById("aid");
  btn.onclick=()=>{const v=inp.value.trim();if(!v){inp.focus();return;}S.annotatorId=v;saveCache();S.screen="dashboard";render();};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")btn.click();});
}

/* DASHBOARD */
function statusOf(id){
  const d=S.data[id];
  if(d.clean)return{cls:"done",txt:"clean ✓"};
  if(d.done)return d.marks.filter(m=>!m.deleted&&!m.tag).length?{cls:"active",txt:"needs tags"}:{cls:"done",txt:"done ✓"};
  return{cls:"todo",txt:"not started"};
}
function renderDashboard(){
  const done=PERFORMANCES.filter(p=>statusOf(p.id).cls==="done").length;
  const pieces=[...new Set(PERFORMANCES.map(p=>p.piece_id))];
  let html=`<h1>Performances</h1><div class="prog">${done} / ${PERFORMANCES.length} complete</div>`;
  pieces.forEach(pid=>{
    const group=PERFORMANCES.filter(p=>p.piece_id===pid);
    html+=`<div class="piece-block"><div class="piece-label">${group[0].piece}</div><div class="plist">`;
    group.forEach((p,i)=>{
      const st=statusOf(p.id),nm=S.data[p.id].marks.filter(m=>!m.deleted).length;
      html+=`<div class="prow" data-id="${p.id}"><div><div class="title">Performance ${i+1}</div><div class="sub">${nm?nm+" stop"+(nm>1?"s":"")+" marked":"—"}</div></div><div class="st ${st.cls}">${st.txt}</div></div>`;
    });
    html+=`</div></div>`;
  });
  html+=`<div class="row" style="margin-top:8px"><button class="btn" id="exportBtn">Export annotations</button><span class="muted" style="font-size:12px">Send both JSON + CSV back.</span></div>`;
  app.innerHTML=html;
  document.querySelectorAll(".prow").forEach(r=>r.onclick=()=>{S.currentId=r.dataset.id;openWS();});
  document.getElementById("exportBtn").onclick=exportData;
}

/* WORKSPACE */
function openWS(){
  S.screen="workspace";
  const d=S.data[S.currentId];
  S.ws={phase:(d.done||d.clean)?"tag":"play",playing:false,liveMarks:[],audio:null,_key:null,_ctxStop:null};
  render();
}

function renderWorkspace(){
  const id=S.currentId,p=perf(id),d=S.data[id];
  const group=PERFORMANCES.filter(q=>q.piece_id===p.piece_id);
  const pos=group.findIndex(q=>q.id===id)+1;
  const pages=SCORES[p.piece_id]||[];
  const scoreHtml=pages.length
    ? pages.map(src=>`<img src="${src}" alt="score page" onerror="this.style.display='none'">`).join("")
    : `<div class="score-missing">No score found</div>`;

  app.innerHTML=`
  <div class="wshead" style="margin-bottom:12px">
    <div>
      <h1 style="margin-bottom:2px">${p.piece} — Performance ${pos}</h1>
    </div>
    <button class="btn ghost" id="backBtn">← back</button>
  </div>
  <div class="ws-layout">
    <div class="score-col">${scoreHtml}</div>
    <div class="right-col" id="rightCol"></div>
  </div>`;

  document.getElementById("backBtn").onclick=()=>{teardown();S.screen="dashboard";render();};
  if(S.ws.phase==="play")renderPlay(p.audioUrl);
  else renderTag(p.audioUrl);
}

/* PLAY */
function renderPlay(audioSrc){
  const col=document.getElementById("rightCol");
  col.innerHTML=`
    <div class="banner">Single real-time listen — no rewind. Press <kbd>S</kbd> or MARK at the moment you would stop the student.</div>
    <div class="transport">
      <div class="clock"><span id="cur">00:00.00</span> <span class="tot">/ <span id="tot">--:--</span></span></div>
      <div class="meter"><div class="fill" id="fill"></div></div>
      <div class="row" style="gap:8px">
        <button class="btn ghost" id="playBtn">▶ Start</button>
      </div>
      <button class="markbtn" id="markBtn" disabled>MARK STOP · S</button>
      <div class="chips" id="chips"></div>
      <div class="hint" id="phint">Press Start when ready.</div>
    </div>`;

  const a=new Audio(audioSrc);a.preload="auto";S.ws.audio=a;
  const cur=document.getElementById("cur"),tot=document.getElementById("tot"),
        fill=document.getElementById("fill"),chips=document.getElementById("chips"),
        playBtn=document.getElementById("playBtn"),markBtn=document.getElementById("markBtn"),
        phint=document.getElementById("phint");

  a.addEventListener("loadedmetadata",()=>{tot.textContent=fmt(a.duration);});
  a.addEventListener("timeupdate",()=>{cur.textContent=fmt(a.currentTime);if(a.duration)fill.style.width=(100*a.currentTime/a.duration)+"%";});
  a.addEventListener("error",()=>{phint.textContent="Audio not found: "+audioSrc;playBtn.disabled=true;});

  const drawChips=()=>{chips.innerHTML=S.ws.liveMarks.map(t=>`<span class="chip">${fmt(t)}</span>`).join("");};
  const doMark=()=>{if(!S.ws.playing)return;S.ws.liveMarks.push(+a.currentTime.toFixed(3));drawChips();markBtn.style.transform="scale(.93)";setTimeout(()=>markBtn.style.transform="",80);};

  playBtn.onclick=()=>{a.play();S.ws.playing=true;playBtn.disabled=true;playBtn.textContent="listening…";markBtn.disabled=false;phint.textContent="No rewind. Mark as you go.";};
  markBtn.onclick=doMark;
  const kh=e=>{if(e.repeat)return;if(e.key==="s"||e.key==="S"||e.key==="Enter"){e.preventDefault();doMark();}};
  document.addEventListener("keydown",kh);S.ws._key=kh;

  a.addEventListener("ended",()=>{
    S.ws.playing=false;document.removeEventListener("keydown",kh);
    const d=S.data[S.currentId];
    d.marks=S.ws.liveMarks.map(t=>({t,tag:"",deleted:false}));
    d.done=true;saveCache();S.ws.phase="tag";render();
  });
}

/* TAG */
function renderTag(audioSrc){
  const id=S.currentId,d=S.data[id];
  const col=document.getElementById("rightCol");

  if(d.clean){
    col.innerHTML=`<div class="banner">Marked as <b>no intervention needed</b>.</div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost" id="undoClean">Undo</button>
      <button class="btn" id="doneBtn">Done</button>
    </div>`;
    document.getElementById("undoClean").onclick=()=>{d.clean=false;d.done=false;saveCache();openWS();};
    document.getElementById("doneBtn").onclick=()=>{teardown();S.screen="dashboard";render();};
    return;
  }

  const marks=d.marks;
  col.innerHTML=`
    <h2 style="margin-top:0">Label each stop</h2>
    <p class="muted" style="font-size:13px;margin-bottom:8px">Tag each mark. ▶ plays 4s of context. Delete only if accidental.</p>
    <audio id="ctx" src="${audioSrc}" controls></audio>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px" id="mlist"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" id="cleanBtn">No intervention needed</button>
      <button class="btn" id="doneBtn">Save &amp; back</button>
    </div>`;

  const ctx=document.getElementById("ctx"),mlist=document.getElementById("mlist");
  const draw=()=>{
    if(!marks.length){mlist.innerHTML=`<p class="muted" style="font-size:13px">No stops marked. Use the button below if correct.</p>`;return;}
    mlist.innerHTML=marks.map((m,i)=>`
      <div class="mrow ${m.deleted?"del":""}">
        <div class="mtime">${fmt(m.t)}</div>
        <div class="tagbtns">${TAGS.map(t=>`<button class="tbtn ${m.tag===t.k?"on":""}" data-t="${t.k}" data-i="${i}">${t.l}</button>`).join("")}</div>
        <div style="display:flex;gap:4px">
          <button class="sbtn" data-play="${i}">▶</button>
          <button class="sbtn" data-del="${i}">${m.deleted?"restore":"del"}</button>
        </div>
      </div>`).join("");
    mlist.querySelectorAll(".tbtn").forEach(b=>b.onclick=()=>{marks[+b.dataset.i].tag=b.dataset.t;saveCache();draw();});
    mlist.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{marks[+b.dataset.del].deleted=!marks[+b.dataset.del].deleted;saveCache();draw();});
    mlist.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{const t=marks[+b.dataset.play].t;ctx.currentTime=Math.max(0,t-2);ctx.play();clearTimeout(S.ws._ctxStop);S.ws._ctxStop=setTimeout(()=>ctx.pause(),4500);});
  };
  draw();
  document.getElementById("cleanBtn").onclick=()=>{d.clean=true;saveCache();openWS();};
  document.getElementById("doneBtn").onclick=()=>{
    const un=marks.filter(m=>!m.deleted&&!m.tag).length;
    if(un&&!confirm(un+" stop(s) have no tag. Save anyway?"))return;
    teardown();S.screen="dashboard";render();
  };
}

function teardown(){
  if(S.ws){if(S.ws.audio){try{S.ws.audio.pause();}catch(e){}}if(S.ws._key)document.removeEventListener("keydown",S.ws._key);clearTimeout(S.ws._ctxStop);}
}

/* EXPORT */
function exportData(){
  const at=new Date().toISOString();
  const payload={annotatorId:S.annotatorId,exportedAt:at,performances:PERFORMANCES.map(p=>{const d=S.data[p.id];return{id:p.id,piece:p.piece,piece_id:p.piece_id,recording_number:p.recording_number,clean:d.clean,completed:d.done,marks:d.marks.map((m,i)=>({index:i,timestamp_sec:m.t,tag:m.tag||null,deleted:m.deleted}))};})};
  dl(`stops_${S.annotatorId}_${stamp()}.json`,JSON.stringify(payload,null,2),"application/json");
  let rows=[["annotator","exported_at","id","piece","piece_id","recording_number","clean","completed","mark_index","timestamp_sec","tag","deleted"]];
  PERFORMANCES.forEach(p=>{const d=S.data[p.id];if(!d.marks.length)rows.push([S.annotatorId,at,p.id,p.piece,p.piece_id,p.recording_number,d.clean,d.done,"","","",""]);else d.marks.forEach((m,i)=>rows.push([S.annotatorId,at,p.id,p.piece,p.piece_id,p.recording_number,d.clean,d.done,i,m.t,m.tag||"",m.deleted]));});
  dl(`stops_${S.annotatorId}_${stamp()}.csv`,rows.map(r=>r.map(c=>{c=String(c);return/[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(",")).join("\n"),"text/csv");
}
const stamp=()=>new Date().toISOString().replace(/[:.]/g,"-").slice(0,19);
function dl(name,text,type){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500);}
window.addEventListener("beforeunload",e=>{if(Object.values(S.data).some(d=>d.done||d.clean)){e.preventDefault();e.returnValue="";}});
render();
</script>
</body>
</html>
